name: Build and Release scs-intellisense

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10.33.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (compile & package)
        run: pnpm compile

      - name: List release/latest (debug)
        run: ls -la release/latest || true

      - name: Read manifest and set VSIX path
        id: manifest
        run: |
          set -euo pipefail
          node -e "const m=require('./release/manifest.json'); if(!m || !m.latest || !m.latest.path){console.error('manifest.latest.path missing'); process.exit(2);} console.log(m.latest.path)" > /tmp/vsix_path
          VSIX_PATH=$(cat /tmp/vsix_path)
          if [ ! -f "$VSIX_PATH" ]; then
            echo "::error::VSIX declared in manifest not found at $VSIX_PATH"
            exit 1
          fi
          BASENAME=$(basename "$VSIX_PATH")
          echo "vsix=$VSIX_PATH" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generte_release_notes: true

      - name: Upload VSIX to Release
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.manifest.outputs.vsix }}
          asset_name: ${{ steps.manifest.outputs.vsix_name }}
          asset_content_type: application/octet-stream

      - name: Validate VSCE_TOKEN
        if: ${{ secrets.VSCE_TOKEN != '' }}
        id: validate
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u :$VSCE_TOKEN "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=6.0")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::VSCE token validation failed (status $HTTP_STATUS)"
            exit 1
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate VSIX version matches tag
        run: |
          set -euo pipefail
          VSIX="${{ steps.manifest.outputs.vsix }}"
          VSIX_VER=$(unzip -p "$VSIX" "extension/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
          TAG_VER=${GITHUB_REF_NAME#v}
          if [ "$VSIX_VER" != "$TAG_VER" ]; then
            echo "::error::Version mismatch: vsix=$VSIX_VER tag=$TAG_VER"
            exit 1
          fi

      - name: Publish VSIX to Visual Studio Marketplace
        if: ${{ secrets.VSCE_TOKEN != '' && steps.validate.outputs.valid == 'true' }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: pnpm dlx -y vsce publish --pat "$VSCE_TOKEN" --packagePath "${{ steps.manifest.outputs.vsix }}"
